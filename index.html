<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Entrada</title>
<style>
  @font-face {
    font-family: 'ComicFallback';
    src: local('Comic Sans MS'), local('Comic Sans');
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* soft circular glow gradient */
  #glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 48%,
        rgba(210,210,215,0.16) 0%,
        rgba(150,150,155,0.09) 18%,
        rgba(60,60,65,0.05) 38%,
        rgba(0,0,0,0) 65%);
    pointer-events: none;
  }

  /* subtle cloth / fabric texture overlay for the whole page */
  #fabric {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: overlay;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    background-size: 6px 6px, 6px 6px;
  }

  #maskWrap {
    position: relative;
    width: min(46vw, 380px);
    height: min(46vw, 380px);
    perspective: 1200px;
    cursor: pointer;
    filter: drop-shadow(0 0 28px rgba(255,255,255,0.06));
    animation: idleFloat 5.5s ease-in-out infinite;
    transform-origin: 50% 60%;
  }

  /* movimento idle muito sutil, quase imperceptivel */
  @keyframes idleFloat {
    0%   { transform: translateY(0px) rotate(0deg); }
    25%  { transform: translateY(-2.5px) rotate(0.35deg); }
    50%  { transform: translateY(0px) rotate(0deg); }
    75%  { transform: translateY(2.5px) rotate(-0.35deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  /* tremidinha leve, disparada via JS somando uma classe temporaria */
  #maskWrap.shake-small {
    animation: shakeSmall 0.28s ease-in-out;
  }

  @keyframes shakeSmall {
    0%   { transform: translate(0,0) rotate(0deg); }
    20%  { transform: translate(-1.5px, 1px) rotate(-0.6deg); }
    40%  { transform: translate(1.5px, -1px) rotate(0.6deg); }
    60%  { transform: translate(-1px, 1px) rotate(-0.4deg); }
    80%  { transform: translate(1px, -0.5px) rotate(0.3deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  /* tremida forte, chance bem baixa */
  #maskWrap.shake-big {
    animation: shakeBig 0.45s ease-in-out;
  }

  @keyframes shakeBig {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    10%  { transform: translate(-6px, 3px) rotate(-3deg) scale(1.01); }
    25%  { transform: translate(6px, -4px) rotate(3.5deg) scale(1.015); }
    40%  { transform: translate(-5px, 4px) rotate(-2.5deg) scale(1.01); }
    55%  { transform: translate(5px, -3px) rotate(2.5deg) scale(1.005); }
    70%  { transform: translate(-3px, 2px) rotate(-1.5deg); }
    85%  { transform: translate(2px, -1px) rotate(1deg); }
    100% { transform: translate(0,0) rotate(0deg) scale(1); }
  }

  #maskInner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.55,.06,.15,.99);
  }

  #maskInner.flipped {
    transform: rotateY(180deg);
  }

  .maskFace {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .maskFace img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    -webkit-user-drag: none;
    user-select: none;
  }

  /* fabric texture clipped onto the mask itself */
  .maskFace::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
    mix-blend-mode: multiply;
    background-image:
      repeating-linear-gradient(15deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(-75deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 4px);
    -webkit-mask-image: var(--face-mask);
    mask-image: var(--face-mask);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }

  .front {
    transform: rotateY(0deg);
  }

  .back {
    transform: rotateY(180deg);
  }

  /* approach + lose focus + fade to black stage */
  #maskWrap.approach {
    animation: approachAnim 1.5s ease-in forwards;
  }

  @keyframes approachAnim {
    0%   { transform: scale(1) translateZ(0); filter: blur(0px) drop-shadow(0 0 28px rgba(255,255,255,0.06)); }
    55%  { transform: scale(2.8); filter: blur(2px) drop-shadow(0 0 10px rgba(255,255,255,0.05)); }
    100% { transform: scale(7); filter: blur(14px) drop-shadow(0 0 0 rgba(255,255,255,0)); }
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease-in;
    z-index: 50;
  }

  #blackout.on {
    opacity: 1;
  }

  #caption {
    position: absolute;
    top: calc(50% + min(30vw, 250px));
    left: 50%;
    transform: translateX(-50%);
    width: 96vw;
    text-align: center;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }

  #caption.fadeOutFast {
    transition: opacity 0.35s ease;
    opacity: 0 !important;
  }

  #caption.show {
    opacity: 1;
  }

  #caption .letter {
    display: inline-block;
    position: relative;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
    font-weight: bold;
    font-size: clamp(11px, 2.3vw, 22px);
    padding: 2px 5px;
    margin: 0 1px;
    line-height: 1.15;
    opacity: 0;
    transform: translateY(0px) rotate(0deg) scale(0.6);
    animation: letterPop 0.55s ease forwards;
    box-shadow:
      1px 2px 0px rgba(0,0,0,0.25),
      0 1px 3px rgba(0,0,0,0.35);
  }

  #caption .letter.torn {
    clip-path: polygon(
      2% 8%, 12% 0%, 28% 4%, 40% 0%, 55% 3%, 70% 0%, 85% 5%, 100% 2%,
      98% 20%, 100% 40%, 96% 55%, 100% 72%, 97% 88%, 100% 100%,
      80% 97%, 65% 100%, 48% 96%, 32% 100%, 18% 97%, 3% 100%,
      0% 82%, 4% 65%, 0% 48%, 3% 30%, 0% 15%
    );
  }

  @keyframes letterPop {
    0%   { opacity: 0; transform: translateY(14px) scale(0.5) rotate(0deg); }
    55%  { opacity: 1; transform: translateY(-10px) scale(1.15) rotate(var(--r)); }
    75%  { transform: translateY(3px) scale(0.95) rotate(var(--r)); }
    100% { opacity: 1; transform: translateY(0px) scale(1) rotate(var(--r)); }
  }


  /* Tela inicial de disclaimer */
  #disclaimer {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #000;
    color: #f2f2f2;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }

  #disclaimer.fadeOut {
    opacity: 0;
    pointer-events: none;
  }

  #disclaimerBox {
    width: min(680px, 90vw);
    text-align: center;
    line-height: 1.65;
    font-size: clamp(13px, 1.7vw, 17px);
    letter-spacing: 0.2px;
  }

  #disclaimerBox p {
    margin: 0;
  }

  #disclaimerHint {
    margin-top: 22px;
    opacity: 0.45;
    font-size: clamp(10px, 1.3vw, 13px);
  }

</style>
</head>
<body>

<div id="soundGate"><span>toque para entrar 🔊</span></div>

<div id="stage">
  <div id="glow"></div>
  <div id="fabric"></div>

  <div id="maskWrap">
    <div id="maskInner">
      <div class="maskFace front" style="--face-mask:url('assets/images/mascara-lado-1.png');">
        <img src="assets/images/mascara-lado-1.png" alt="mascara lado 1" draggable="false">
      </div>
      <div class="maskFace back" style="--face-mask:url('assets/images/mascara-lado-2.png');">
        <img src="assets/images/mascara-lado-2.png" alt="mascara lado 2" draggable="false">
      </div>
    </div>
  </div>

  <div id="caption"></div>
</div>

<div id="blackout"></div>

<audio id="bgMusic" src="assets/audio/background-music.mp3" autoplay loop preload="auto"></audio>
<audio id="letterSfx1" src="assets/audio/letter1.mp3" preload="auto"></audio>
<audio id="letterSfx2" src="assets/audio/letter2.mp3" preload="auto"></audio>
<audio id="letterSfx3" src="assets/audio/letter3.mp3" preload="auto"></audio>

<script>
  const wrap = document.getElementById('maskWrap');
  const inner = document.getElementById('maskInner');
  const blackout = document.getElementById('blackout');
  const captionEl = document.getElementById('caption');
  const soundGate = document.getElementById('soundGate');

  const bgMusic = document.getElementById('bgMusic');
  const disclaimer = document.getElementById('disclaimer');

  bgMusic.volume = 0.18; // musica de fundo baixa

  // A primeira interação é usada para liberar o áudio.
  // O clique acontece no disclaimer, antes da cena da máscara.
  disclaimer.addEventListener('click', () => {
    bgMusic.play().catch(() => {});
    disclaimer.classList.add('fadeOut');

    setTimeout(() => {
      disclaimer.remove();
    }, 850);
  }, { once: true });

  // Também tenta autoplay caso o navegador permita.
  window.addEventListener('load', () => {
    bgMusic.play().catch(() => {});
  });


  const letterSfx = [
    document.getElementById('letterSfx1'),
    document.getElementById('letterSfx2'),
    document.getElementById('letterSfx3'),
  ];
  letterSfx.forEach(a => a.volume = 0.35);

  function playLetterSound() {
    const base = letterSfx[Math.floor(Math.random() * letterSfx.length)];
    // clona pra permitir sobreposicao caso as letras apareçam rápido
    const clone = base.cloneNode(true);
    clone.volume = base.volume;
    clone.play().catch(() => {});
  }

  // libera audio no primeiro toque (navegadores exigem interacao do usuario)
  soundGate.addEventListener('click', () => {
    bgMusic.play().catch(() => {});
    soundGate.classList.add('hidden');
    setTimeout(() => soundGate.remove(), 600);
  }, { once: true });

  const phrase = "você só pode adentrar nesse mundo usando uma mascara...";

  // paleta inspirada em recortes de revista/jornal (papercut ransom note)
  const paperPalette = [
    { bg: '#e2412a', fg: '#ffffff' }, // vermelho
    { bg: '#2d5fb0', fg: '#ffffff' }, // azul
    { bg: '#f2c230', fg: '#2b2b2b' }, // amarelo
    { bg: '#5a8f3c', fg: '#ffffff' }, // verde
    { bg: '#6a4c93', fg: '#ffffff' }, // roxo
    { bg: '#e8772e', fg: '#2b2b2b' }, // laranja
    { bg: '#7a5230', fg: '#ffffff' }, // marrom
    { bg: '#f5f0e6', fg: '#2b2b2b' }, // papel claro
    { bg: '#c9d84a', fg: '#2b2b2b' }, // amarelo-esverdeado
  ];

  function typeLetters(text, container) {
    container.classList.add('show');
    let delay = 0;
    for (const ch of text) {
      const span = document.createElement('span');
      span.className = 'letter';
      if (Math.random() > 0.35) span.classList.add('torn');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = delay + 'ms';

      const randomRot = (Math.random() * 22 - 11).toFixed(1); // -11deg a 11deg
      span.style.setProperty('--r', randomRot + 'deg');

      if (ch !== ' ' && ch !== '\u00A0') {
        const c = paperPalette[Math.floor(Math.random() * paperPalette.length)];
        span.style.background = c.bg;
        span.style.color = c.fg;

        const thisDelay = delay;
        setTimeout(playLetterSound, thisDelay);
      } else {
        span.style.boxShadow = 'none';
      }

      container.appendChild(span);
      delay += 45;
    }
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      typeLetters(phrase, captionEl);
    }, 1000);
  });

  // tremidinhas aleatorias na mascara: a maioria leve, chance bem baixa de ser forte
  let clicked = false;

  function scheduleShake() {
    if (clicked) return;
    const nextIn = 2200 + Math.random() * 3800; // entre 2.2s e 6s
    setTimeout(() => {
      if (clicked) return;

      const isBig = Math.random() < 0.06; // ~6% de chance de tremida forte
      wrap.classList.remove('shake-small', 'shake-big');
      // forca reflow pra permitir reiniciar a animacao
      void wrap.offsetWidth;
      wrap.classList.add(isBig ? 'shake-big' : 'shake-small');

      setTimeout(() => {
        wrap.classList.remove('shake-small', 'shake-big');
      }, isBig ? 500 : 320);

      scheduleShake();
    }, nextIn);
  }
  scheduleShake();

  wrap.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;

    captionEl.classList.add('fadeOutFast');
    inner.classList.add('flipped');
    wrap.classList.remove('shake-small', 'shake-big');

    setTimeout(() => {
      wrap.classList.add('approach');
    }, 850);

    setTimeout(() => {
      blackout.classList.add('on');
      // musica de fundo vai sumindo junto com o fade pro preto
      const fadeMusic = setInterval(() => {
        if (bgMusic.volume > 0.01) {
          bgMusic.volume = Math.max(0, bgMusic.volume - 0.01);
        } else {
          bgMusic.pause();
          clearInterval(fadeMusic);
        }
      }, 40);
    }, 1650);

    setTimeout(() => {
      // Espaco para trigger da proxima cena / navegacao futura
      // window.location.href = 'proxima-pagina.html';
    }, 2900);
  });
</script>

</body>
</html>
