<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Fonte</title>
<link rel="stylesheet" href="assets/css/cursor.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
  }

  /* ---------- cenario em tela cheia, sem tarja preta ---------- */
  #sceneWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  /* mantem a proporcao 16:9 da arte de fundo (Fonteparauso.jpg e
     2560x1440 = 16:9), sempre cobrindo a tela inteira, igual no mapa.
     Todas as posicoes dos personagens sao % relativas a este mesmo box,
     entao ficam alinhadas com a arte independente do tamanho da tela. */
  #sceneInner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: max(100vw, 177.78vh);  /* 16/9 */
    height: max(100vh, 56.25vw);  /* 9/16 */
    transform: translate(-50%, -50%);
  }

  #sceneInner > img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------- personagens (bonecos de vareta) ---------- */
  .puppet {
    position: absolute;
    user-select: none;
    -webkit-user-drag: none;
  }

  .puppet img {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* fantasma: sempre presente, sentado na abobora, com uma leve
     flutuacao continua pra nao parecer estatico */
  #fantasma {
    left: 10.27%;
    top: 0%;
    width: 21.80%;
    height: 100%;
    transform-origin: 50% 92%; /* pivot perto da base do pauzinho */
    animation: idleFloatFantasma 4.5s ease-in-out infinite;
  }

  @keyframes idleFloatFantasma {
    0%, 100% { transform: rotate(0deg) translateY(0px); }
    50%      { transform: rotate(0.6deg) translateY(-4px); }
  }

  /* usuario: comeca fora da tela (direita) e deslisa pra posicao final */
  #usuario {
    left: 72.73%;
    top: 27.85%;
    width: 14.84%;
    height: 72.78%;
    transform-origin: 50% 92%;
    transform: translateX(55vw);
    transition: transform 1.3s cubic-bezier(.22, .8, .2, 1);
  }

  #usuario.arrived {
    transform: translateX(0);
  }

  /* tremida de "boneco falando": movimento brusco mas sem sair do lugar */
  @keyframes puppetTalk {
    0%   { transform: translate(0,0) rotate(0deg); }
    15%  { transform: translate(-1px, 0.8px) rotate(-0.7deg); }
    30%  { transform: translate(1px, -0.6px) rotate(0.6deg); }
    45%  { transform: translate(-0.8px, 1px) rotate(-0.5deg); }
    60%  { transform: translate(0.8px, -0.8px) rotate(0.7deg); }
    75%  { transform: translate(-0.8px, 0.6px) rotate(-0.5deg); }
    90%  { transform: translate(0.6px, -0.3px) rotate(0.3deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  .talking {
    animation: puppetTalk 0.65s ease-in-out infinite !important;
  }

  /* chacoalhada curta quando o usuario "chega" na posicao */
  @keyframes arriveWobble {
    0%   { transform: translateX(0) rotate(0deg); }
    20%  { transform: translateX(0) rotate(-3deg); }
    40%  { transform: translateX(0) rotate(2.5deg); }
    60%  { transform: translateX(0) rotate(-1.6deg); }
    80%  { transform: translateX(0) rotate(0.8deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }

  #usuario.wobble {
    animation: arriveWobble 0.6s ease-out;
  }

  /* ---------- caixa de dialogo (estilo visual novel) ---------- */
  #dialogueBox {
    position: fixed;
    left: 50%;
    bottom: 4%;
    width: min(86vw, 900px);
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 14, 12, 0.86);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 26px 30px 22px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55);
    color: #f0ede4;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 20;
  }

  #dialogueBox.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #speakerName {
    position: absolute;
    top: -18px;
    left: 24px;
    padding: 5px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  #speakerName.fantasma {
    background: #5a8f3c;
    color: #f4fff0;
  }

  #speakerName.usuario {
    background: #e8772e;
    color: #2b2b2b;
  }

  #dialogueText {
    font-size: clamp(14px, 2vw, 18px);
    line-height: 1.55;
    min-height: 3.2em;
  }

  #advanceHint {
    position: absolute;
    right: 18px;
    bottom: 10px;
    font-size: 11px;
    font-style: italic;
    opacity: 0.55;
  }

  /* ---------- menu de escolhas (perguntas do jogador) ---------- */
  #choiceMenu {
    position: fixed;
    left: 50%;
    bottom: 4%;
    width: min(86vw, 900px);
    transform: translateX(-50%) translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 20;
  }

  #choiceMenu.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  #choicePrompt {
    color: #ccc;
    font-size: 13px;
    font-style: italic;
    margin-bottom: 8px;
    padding-left: 6px;
  }

  #choiceList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(15, 14, 12, 0.86);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55);
  }

  .choice-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px 16px;
    color: #f0ede4;
    font-family: inherit;
    font-size: clamp(13px, 1.8vw, 16px);
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .choice-btn:hover {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.35);
    transform: translateX(3px);
  }

  .choice-btn.sair {
    color: #e8a06a;
    border-color: rgba(232,119,46,0.4);
  }

  .choice-btn.sair:hover {
    background: rgba(232,119,46,0.15);
    border-color: rgba(232,119,46,0.6);
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in;
    z-index: 50;
  }

  #blackout.on {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="sceneWrap">
  <div id="sceneInner">
    <!-- troque pelo caminho real quando subir pro GitHub -->
    <img class="bg" src="assets/images/fonte-cenario.jpg" alt="cenario da fonte" draggable="false">

    <div class="puppet" id="fantasma">
      <img src="assets/images/fantasmafonte.png" alt="fantasma da fonte" draggable="false">
    </div>

    <div class="puppet" id="usuario">
      <img src="assets/images/usuariofonte.png" alt="usuario" draggable="false">
    </div>
  </div>
</div>

<div id="dialogueBox">
  <div id="speakerName"></div>
  <div id="dialogueText"></div>
  <div id="advanceHint">(clique para continuar)</div>
</div>

<div id="choiceMenu">
  <div id="choicePrompt">O que você quer perguntar?</div>
  <div id="choiceList"></div>
</div>

<div id="blackout"></div>

<!-- troque pelo caminho real quando subir pro GitHub -->
<audio id="bgMusic" src="assets/audio/fonte-music.mp3" loop preload="auto"></audio>

<script>
  const fantasma = document.getElementById('fantasma');
  const usuario = document.getElementById('usuario');
  const dialogueBox = document.getElementById('dialogueBox');
  const speakerName = document.getElementById('speakerName');
  const dialogueText = document.getElementById('dialogueText');
  const advanceHint = document.getElementById('advanceHint');
  const choiceMenu = document.getElementById('choiceMenu');
  const choiceList = document.getElementById('choiceList');
  const blackout = document.getElementById('blackout');
  const bgMusic = document.getElementById('bgMusic');

  bgMusic.volume = 0.25;

  // ---------- musica de fundo (com fallback pra politica de autoplay) ----------
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    bgMusic.play().catch(() => {});
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  bgMusic.play().catch(() => {}); // tenta direto; se o navegador bloquear, o proximo clique libera
  document.addEventListener('click', unlockAudio, { once: true });

  // ---------- "voz" do fantasma sintetizada na hora (sem arquivo de audio),
  // um pizzicato curto de violino toda vez que uma letra aparece ----------
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playBlip() {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // pequena variacao de altura, tipo o "blip" do Undertale
    const baseFreq = 392 + (Math.random() * 50 - 25); // em torno de um Sol4

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth'; // rico em harmonicos, mais parecido com corda do que uma onda senoidal
    osc.frequency.setValueAtTime(baseFreq, now);

    // um leve vibrato rapido pra dar caracter de corda friccionada
    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 26;
    const vibratoGain = ctx.createGain();
    vibratoGain.gain.value = 6;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2200;
    filter.Q.value = 0.8;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.32, now + 0.012);  // ataque rapido (pizzicato)
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11); // decaimento curto

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    vibrato.start(now);
    osc.stop(now + 0.12);
    vibrato.stop(now + 0.12);
  }

  // ---------- PLACEHOLDER: falas e perguntas de exemplo, troque pelo roteiro real ----------
  const introLines = [
    '(texto de exemplo) Ah... você chegou. Eu sabia que apareceria por aqui algum dia.',
    '(texto de exemplo) Sinta-se livre pra perguntar o que quiser. Eu tenho bastante tempo livre... o tempo todo, na verdade.',
  ];

  const questions = [
    { q: 'Quem é você?',
      a: '(texto de exemplo) Eu já fui alguém com um nome. Hoje sou só o que restou perto dessa fonte.' },
    { q: 'Onde eu estou?',
      a: '(texto de exemplo) Essa vila existe entre o que foi esquecido e o que ainda se recusa a desaparecer.' },
    { q: 'O que aconteceu aqui?',
      a: '(texto de exemplo) Isso é uma história longa. Talvez, com o tempo, eu conte um pedaço dela.' },
    { q: 'Você pode me ajudar?',
      a: '(texto de exemplo) Talvez. Mas ajuda, por aqui, sempre tem um preço.' },
  ];

  // ---------- motor de typewriter (estilo Undertale) ----------
  const TYPE_SPEED_MS = 42; // tempo entre cada letra
  let typeInterval = null;
  let typing = false;
  let onTypingDone = null;

  function typeText(text, onDone) {
    clearInterval(typeInterval);
    dialogueText.textContent = '';
    advanceHint.style.opacity = '0';
    fantasma.classList.add('talking');
    typing = true;
    onTypingDone = onDone;

    let i = 0;
    typeInterval = setInterval(() => {
      const ch = text[i];
      dialogueText.textContent += ch;
      if (ch !== ' ') playBlip();
      i++;
      if (i >= text.length) {
        finishTyping();
      }
    }, TYPE_SPEED_MS);
  }

  function finishTyping(skippedText) {
    clearInterval(typeInterval);
    if (skippedText !== undefined) dialogueText.textContent = skippedText;
    typing = false;
    fantasma.classList.remove('talking');
    advanceHint.style.opacity = '0.55';
    if (onTypingDone) onTypingDone();
  }

  // ---------- fluxo de dialogo ----------
  let introIndex = 0;

  function showIntroLine(i) {
    speakerName.textContent = 'Fantasma da Fonte';
    speakerName.className = 'fantasma';
    typeText(introLines[i], () => {});
  }

  function advanceIntro() {
    if (typing) {
      finishTyping(introLines[introIndex]);
      return;
    }
    introIndex++;
    if (introIndex < introLines.length) {
      showIntroLine(introIndex);
    } else {
      dialogueBox.classList.remove('show');
      dialogueBox.removeEventListener('click', advanceIntro);
      openChoiceMenu();
    }
  }

  function startDialogue() {
    dialogueBox.classList.add('show');
    dialogueBox.addEventListener('click', advanceIntro);
    introIndex = 0;
    showIntroLine(0);
  }

  // ---------- menu de perguntas ----------
  function buildChoiceMenu() {
    choiceList.innerHTML = '';
    questions.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = item.q;
      btn.addEventListener('click', () => askQuestion(idx));
      choiceList.appendChild(btn);
    });

    const sairBtn = document.createElement('button');
    sairBtn.className = 'choice-btn sair';
    sairBtn.textContent = 'Sair';
    sairBtn.addEventListener('click', leaveScene);
    choiceList.appendChild(sairBtn);
  }

  function openChoiceMenu() {
    choiceMenu.classList.add('show');
  }

  function closeChoiceMenu() {
    choiceMenu.classList.remove('show');
  }

  function askQuestion(idx) {
    closeChoiceMenu();
    dialogueBox.classList.add('show');

    const respond = () => {
      speakerName.textContent = 'Fantasma da Fonte';
      speakerName.className = 'fantasma';
      typeText(questions[idx].a, () => {});
    };
    respond();

    function onAnswerClick() {
      if (typing) {
        finishTyping(questions[idx].a);
        return;
      }
      dialogueBox.removeEventListener('click', onAnswerClick);
      dialogueBox.classList.remove('show');
      openChoiceMenu();
    }
    dialogueBox.addEventListener('click', onAnswerClick);
  }

  function leaveScene() {
    closeChoiceMenu();
    blackout.classList.add('on');
    setTimeout(() => {
      window.location.href = 'mapa.html';
    }, 700);
  }

  buildChoiceMenu();

  // ---------- entrada do usuario ----------
  window.addEventListener('load', () => {
    setTimeout(() => {
      usuario.classList.add('arrived');
    }, 500);

    usuario.addEventListener('transitionend', function onArrive(e) {
      if (e.propertyName !== 'transform') return;
      usuario.removeEventListener('transitionend', onArrive);
      usuario.classList.add('wobble');
      setTimeout(() => usuario.classList.remove('wobble'), 650);

      setTimeout(startDialogue, 400);
    });
  });
</script>

</body>
</html>
