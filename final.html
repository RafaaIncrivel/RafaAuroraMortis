<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Final</title>
<link rel="stylesheet" href="assets/css/cursor.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
  }

  /* ---------- cena em tela cheia, sem tarja preta ---------- */
  #sceneWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  /* mesmo truque de "cover" usado nas outras cenas: mantem a proporcao
     16:9 das camadas (2560x1440), sempre cobrindo a tela inteira */
  #sceneInner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: max(100vw, 177.78vh);  /* 16/9 */
    height: max(100vh, 56.25vw); /* 9/16 */
    transform: translate(-50%, -50%);
  }

  /* ---------- as 3 camadas do fantasma, todas no mesmo canvas 2560x1440,
     entao todas usam exatamente o mesmo inset:0 / 100% / 100% ---------- */
  .ghost-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #ghostBody       { z-index: 1; }  /* corpo/rosto real, sempre atras -- pode vazar um pouco */
  #ghostMask       { z-index: 2; }  /* mascara em repouso, na cara do fantasma */
  #handsOnMask     { z-index: 3; }  /* maos ja agarrando a mascara -- fica ABAIXO da franja */
  #ghostFringe     { z-index: 4; }  /* franja, sempre na frente */
  #handCursor      { z-index: 5; }  /* maos "soltas" flutuando, substituem o cursor do sistema */

  #ghostMask.hidden-during-grip {
    display: none;
  }

  #handCursor,
  #handsOnMask {
    display: none;
  }

  #handCursor.show,
  #handsOnMask.show {
    display: block;
  }

  /* wrapper interno so pra tremidinha, separado do #sceneInner que centraliza
     a cena -- assim a animacao nunca sobrescreve o translate(-50%,-50%) */
  #shakeWrapper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* tremidinha leve enquanto o jogador esta ativamente puxando a mascara */
  @keyframes ghostTremble {
    0%   { transform: translate(0, 0) rotate(0deg); }
    20%  { transform: translate(-1px, 0.6px) rotate(-0.3deg); }
    40%  { transform: translate(1px, -0.6px) rotate(0.3deg); }
    60%  { transform: translate(-0.6px, 0.8px) rotate(-0.2deg); }
    80%  { transform: translate(0.8px, -0.4px) rotate(0.2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  #shakeWrapper.trembling {
    animation: ghostTremble 0.22s ease-in-out infinite;
  }

  /* ---------- caixa de dialogo (mesmo estilo usado na fonte) ---------- */
  #dialogueBox {
    position: fixed;
    left: 50%;
    bottom: 4%;
    width: min(86vw, 900px);
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 14, 12, 0.86);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 26px 30px 22px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55);
    color: #f0ede4;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 20;
  }

  #dialogueBox.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #speakerName {
    position: absolute;
    top: -18px;
    left: 24px;
    padding: 5px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    background: #5a8f3c;
    color: #f4fff0;
  }

  #dialogueText {
    font-size: clamp(14px, 2vw, 18px);
    line-height: 1.55;
    min-height: 3.2em;
  }

  #advanceHint {
    position: absolute;
    right: 18px;
    bottom: 10px;
    font-size: 11px;
    font-style: italic;
    opacity: 0.55;
  }

  body.locked-cursor,
  body.locked-cursor #sceneWrap {
    cursor: none;
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

  #blackout.on {
    opacity: 1;
  }

  #blackout.fade {
    transition: opacity 0.6s ease-in;
  }
</style>
</head>
<body>

<div id="sceneWrap">
  <div id="sceneInner">
    <div id="shakeWrapper">
      <!-- troque pelos caminhos reais (.png com transparencia) quando subir pro GitHub -->
      <img class="ghost-layer" id="ghostBody"    src="assets/images/fantasmafinal1.png" alt="corpo do fantasma" draggable="false">
      <img class="ghost-layer" id="ghostMask"    src="assets/images/fantasmafinal2.png" alt="mascara do fantasma" draggable="false">
      <img class="ghost-layer" id="handsOnMask"  src="assets/images/maoquematana_mascara.png" alt="" draggable="false">
      <img class="ghost-layer" id="ghostFringe"  src="assets/images/fantasmafinal3.png" alt="franja do fantasma" draggable="false">
      <img class="ghost-layer" id="handCursor"   src="assets/images/maoquemata.png" alt="" draggable="false">
    </div>
  </div>
</div>

<div id="dialogueBox">
  <div id="speakerName">Fantasma</div>
  <div id="dialogueText"></div>
  <div id="advanceHint">(clique para continuar)</div>
</div>

<div id="blackout"></div>

<!-- troque pelos caminhos reais quando subir pro GitHub -->
<audio id="bgMusic" src="assets/audio/final-music.mp3" loop preload="auto"></audio>
<audio id="fleshSfx" src="assets/audio/carne.mp3" loop preload="auto"></audio>
<audio id="boneSfx" src="assets/audio/osso.mp3" loop preload="auto"></audio>

<script>
  const dialogueBox = document.getElementById('dialogueBox');
  const dialogueText = document.getElementById('dialogueText');
  const advanceHint = document.getElementById('advanceHint');
  const ghostMask = document.getElementById('ghostMask');
  const handsOnMask = document.getElementById('handsOnMask');
  const shakeWrapper = document.getElementById('shakeWrapper');
  const handCursor = document.getElementById('handCursor');
  const sceneWrap = document.getElementById('sceneWrap');
  const blackout = document.getElementById('blackout');
  const bgMusic = document.getElementById('bgMusic');
  const fleshSfx = document.getElementById('fleshSfx');
  const boneSfx = document.getElementById('boneSfx');

  bgMusic.volume = 0.25;
  fleshSfx.volume = 0.55;
  boneSfx.volume = 0.5;

  // ---------- musica de fundo (com fallback pra politica de autoplay) ----------
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    bgMusic.play().catch(() => {});
  }
  bgMusic.play().catch(() => {}); // tenta direto; se o navegador bloquear, o proximo clique libera
  document.addEventListener('click', unlockAudio, { once: true });

  function startTearingSfx() {
    fleshSfx.currentTime = 0;
    boneSfx.currentTime = 0;
    fleshSfx.play().catch(() => {});
    boneSfx.play().catch(() => {});
  }

  function stopTearingSfx() {
    fleshSfx.pause();
    boneSfx.pause();
  }

  // ---------- "voz" do fantasma sintetizada na hora (mesmo efeito da fonte.html) ----------
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playBlip() {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const baseFreq = 392 + (Math.random() * 50 - 25);

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(baseFreq, now);

    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 26;
    const vibratoGain = ctx.createGain();
    vibratoGain.gain.value = 6;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2200;
    filter.Q.value = 0.8;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.32, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    vibrato.start(now);
    osc.stop(now + 0.12);
    vibrato.stop(now + 0.12);
  }
  document.addEventListener('click', () => {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
  }, { once: true });

  // ---------- PLACEHOLDER: falas de exemplo antes da mecanica comecar ----------
  const introLines = [
    '(texto de exemplo) Então... você veio até aqui, depois de tudo.',
    '(texto de exemplo) Sabe, eu não escolhi usar essa máscara. Mas talvez seja tarde pra isso importar agora.',
    '(texto de exemplo) Se você tem tanta certeza... vai. Tire então. Vê o que sobrou de mim.',
  ];

  const TYPE_SPEED_MS = 42;
  let typeInterval = null;
  let typing = false;
  let introIndex = 0;

  function typeText(text, onDone) {
    clearInterval(typeInterval);
    dialogueText.textContent = '';
    advanceHint.style.opacity = '0';
    typing = true;

    let i = 0;
    typeInterval = setInterval(() => {
      const ch = text[i];
      dialogueText.textContent += ch;
      if (ch !== ' ') playBlip();
      i++;
      if (i >= text.length) finishTyping(undefined, onDone);
    }, TYPE_SPEED_MS);
  }

  function finishTyping(skippedText, onDone) {
    clearInterval(typeInterval);
    if (skippedText !== undefined) dialogueText.textContent = skippedText;
    typing = false;
    advanceHint.style.opacity = '0.55';
    if (onDone) onDone();
  }

  function showIntroLine(i) {
    typeText(introLines[i], () => {});
  }

  function advanceIntro() {
    if (typing) {
      finishTyping(introLines[introIndex]);
      return;
    }
    introIndex++;
    if (introIndex < introLines.length) {
      showIntroLine(introIndex);
    } else {
      dialogueBox.classList.remove('show');
      dialogueBox.removeEventListener('click', advanceIntro);
      beginMaskPull(); // esse clique conta como o "gesto do usuario" que libera o pointer lock
    }
  }

  dialogueBox.addEventListener('click', advanceIntro);

  window.addEventListener('load', () => {
    setTimeout(() => {
      dialogueBox.classList.add('show');
      showIntroLine(0);
    }, 800);
  });

  // ---------- mecanica de arrancar a mascara ----------
  // resistencia (o quanto do "puxao" das maos passa pro visual das maos+mascara)
  const RESISTANCE_UP = 0.035;   // pra cima: quase nao sai do lugar
  const RESISTANCE_DOWN = 0.16;  // pra baixo: ainda bem resistido
  const RESISTANCE_SIDE = 0.13;  // pros lados: resistido tambem

  // limite RIGIDO de deslocamento (px) das maos+mascara em cada direcao
  const MAX_UP = 10;
  const MAX_DOWN = 55;
  const MAX_SIDE = 55; // um pouco mais generoso que antes

  const SPRING = 0.13;           // velocidade com que tenta voltar ao lugar
  const PULL_THRESHOLD_PX = 38;  // quanto precisa estar deslocada pra baixo pra "contar"
  const PULL_HOLD_SECONDS = 2;   // tempo continuo de puxao pra soltar

  // limites de movimento das MAOS "soltas" (o cursor customizado, antes de agarrar)
  const HAND_SIDE_LIMIT = 42;    // px pros lados -- um pouco mais que antes
  const HAND_UP_LIMIT = 550;     // px pra cima -- teto maximo que as maos podem subir
  const HAND_DOWN_LIMIT = 420;   // px pra baixo -- tambem a posicao inicial

  // posicao inicial das maos (comecam baixas, precisam subir pra area clicavel)
  const HAND_START_Y = 420;

  // zona clicavel: medida em tempo real com o contador de debug
  const GRAB_ZONE_Y_MIN = -76;   // limite de cima (y negativo = mais pra cima)
  const GRAB_ZONE_Y_MAX = 78;    // limite de baixo

  let interactionActive = false;
  let dragging = false;
  let removed = false;

  let handOffset = { x: 0, y: HAND_START_Y }; // maos comecam bem baixas
  let gripStartHand = { x: 0, y: 0 };   // posicao das maos no momento em que comecou a segurar
  let targetOffset = { x: 0, y: 0 };    // pra onde as maos+mascara "querem" ir
  let gripOffset = { x: 0, y: 0 };      // posicao suavizada atual das maos+mascara
  let pullTimer = 0;
  let lastFrame = performance.now();

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function canGrabNow() {
    return handOffset.y >= GRAB_ZONE_Y_MIN && handOffset.y <= GRAB_ZONE_Y_MAX;
  }

  function beginMaskPull() {
    interactionActive = true;
    handCursor.classList.add('show');
    handCursor.style.transform = `translate(${handOffset.x}px, ${handOffset.y}px)`;
    document.body.classList.add('locked-cursor'); // esconde o cursor normal via CSS

    // tenta Pointer Lock de verdade; se o navegador bloquear (ex: Brave),
    // o mousemove abaixo continua funcionando via movementX/Y mesmo sem lock
    const lockPromise = sceneWrap.requestPointerLock();
    if (lockPromise && lockPromise.catch) lockPromise.catch(() => {});
  }

  document.addEventListener('pointerlockerror', () => {
    // sem problema -- o mecanismo de movementX/Y funciona de qualquer jeito
  });

  // usamos e.movementX/e.movementY -- funciona com ou sem Pointer Lock ativo
  document.addEventListener('mousemove', (e) => {
    if (!interactionActive || removed) return;

    handOffset.x = clamp(handOffset.x + e.movementX, -HAND_SIDE_LIMIT, HAND_SIDE_LIMIT);
    handOffset.y = clamp(handOffset.y + e.movementY, -HAND_UP_LIMIT, HAND_DOWN_LIMIT);

    if (!dragging) {
      handCursor.style.transform = `translate(${handOffset.x}px, ${handOffset.y}px)`;
    } else {
      const rawDx = handOffset.x - gripStartHand.x;
      const rawDy = handOffset.y - gripStartHand.y;

      const factorY = rawDy < 0 ? RESISTANCE_UP : RESISTANCE_DOWN;
      const tx = clamp(rawDx * RESISTANCE_SIDE, -MAX_SIDE, MAX_SIDE);
      const ty = clamp(rawDy * factorY, -MAX_UP, MAX_DOWN);

      targetOffset = { x: tx, y: ty };
    }
  });

  document.addEventListener('mousedown', () => {
    if (!interactionActive || removed || dragging) return;
    if (!canGrabNow()) return; // so agarra se as maos estiverem no topo do alcance

    dragging = true;
    gripStartHand = { x: handOffset.x, y: handOffset.y };

    // troca: some a mascara "de repouso" e as maos soltas, aparecem as maos
    // agarrando a mascara (essa e a que recebe toda a fisica/resistencia)
    ghostMask.classList.add('hidden-during-grip');
    handCursor.classList.remove('show');
    handsOnMask.classList.add('show');

    shakeWrapper.classList.add('trembling');
    startTearingSfx();
  });

  document.addEventListener('mouseup', () => releaseGrip());

  function releaseGrip() {
    if (!dragging) return;
    dragging = false;
    stopTearingSfx();
    if (!removed) {
      handsOnMask.classList.remove('show');
      handCursor.classList.add('show');
      ghostMask.classList.remove('hidden-during-grip');
      shakeWrapper.classList.remove('trembling');
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (interactionActive && !removed) {
      const target = dragging ? targetOffset : { x: 0, y: 0 };
      gripOffset.x += (target.x - gripOffset.x) * SPRING;
      gripOffset.y += (target.y - gripOffset.y) * SPRING;

      gripOffset.x = clamp(gripOffset.x, -MAX_SIDE, MAX_SIDE);
      gripOffset.y = clamp(gripOffset.y, -MAX_UP, MAX_DOWN);

      handsOnMask.style.transform = `translate(${gripOffset.x}px, ${gripOffset.y}px)`;

      if (dragging && gripOffset.y > PULL_THRESHOLD_PX) {
        pullTimer += dt;
      } else {
        pullTimer = Math.max(0, pullTimer - dt * 1.4);
      }

      if (pullTimer >= PULL_HOLD_SECONDS) {
        detachMask();
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function detachMask() {
    removed = true;
    dragging = false; // solta automaticamente no momento da queda
    stopTearingSfx();
    bgMusic.pause(); // silencio total no momento da queda
    shakeWrapper.classList.remove('trembling');
    document.body.classList.remove('locked-cursor');
    handCursor.classList.remove('show');
    if (document.exitPointerLock) document.exitPointerLock();

    // animacao de queda: maos + mascara se soltam e caem juntas
    handsOnMask.style.transition = 'transform 0.7s cubic-bezier(.4,0,1,1), opacity 0.5s ease 0.2s';
    handsOnMask.style.transform = `translate(${gripOffset.x * 1.6}px, 140vh) rotate(${gripOffset.x > 0 ? 35 : -35}deg)`;
    handsOnMask.style.opacity = '0.85';

    // corta pra preto na hora (sem fade), assim que o rosto fica exposto
    setTimeout(() => {
      blackout.classList.remove('fade');
      blackout.classList.add('on');

      // depois de 5s no preto, avanca pra proxima pagina
      setTimeout(() => {
        window.location.href = 'theendisneight.html';
      }, 5000);
    }, 700);
  }
</script>

</body>
</html>
