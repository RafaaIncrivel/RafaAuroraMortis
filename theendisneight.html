<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>The End Is Nigh</title>
<link rel="stylesheet" href="assets/css/cursor.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eaeaea;
  }

  h1 {
    font-size: clamp(20px, 4vw, 38px);
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 1.4s ease;
  }

  h1.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <!-- PLACEHOLDER: conteudo real de "theendisneight" entra aqui -->
  <h1 id="title">the end is nigh</h1>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('title').classList.add('show');
      }, 300);
    });
  </script>

</body>
</html>
