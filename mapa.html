<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa da vila</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
  }

  #mapWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    /* mantem a proporcao 16:9 da arte do mapa, sem distorcer,
       deixando tarja preta nas laterais/topo se a tela for diferente */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #mapInner {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 177.78vh; /* 16/9 */
    max-height: 56.25vw; /* 9/16 */
    margin: auto;
  }

  #mapInner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* area clicavel: invisivel, so aparece um contorno leve no hover
     pra facilitar debug. Pode remover o outline do hover depois. */
  .hitbox {
    position: absolute;
    cursor: pointer;
    outline: 1px dashed transparent;
    transition: outline-color 0.15s ease, background 0.15s ease;
  }

  .hitbox:hover {
    outline-color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in;
    z-index: 50;
  }

  #blackout.on {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="mapWrap">
  <div id="mapInner">
    <!-- troque o src pelo caminho real da imagem quando subir pro GitHub -->
    <img src="assets/images/mapa-beta-1.jpg" alt="mapa da vila" draggable="false">

    <!-- 1 - fonte -->
    <a class="hitbox" data-dest="fonte.html"
       style="left:39.79%; top:34.26%; width:7.68%; height:14.95%;"
       aria-label="fonte"></a>

    <!-- 2 - casa 1 -->
    <a class="hitbox" data-dest="casa1.html"
       style="left:25.73%; top:29.81%; width:7.27%; height:15.88%;"
       aria-label="casa 1"></a>

    <!-- 3 - prefeitura -->
    <a class="hitbox" data-dest="prefeitura.html"
       style="left:20.73%; top:56.30%; width:10.29%; height:23.10%;"
       aria-label="prefeitura"></a>

    <!-- 4 - lago de almas -->
    <a class="hitbox" data-dest="lago-de-almas.html"
       style="left:40.52%; top:68.52%; width:7.79%; height:14.77%;"
       aria-label="lago de almas"></a>

    <!-- 5 - castelo das mascaras -->
    <a class="hitbox" data-dest="castelo-das-mascaras.html"
       style="left:63.33%; top:62.96%; width:7.89%; height:16.81%;"
       aria-label="castelo das mascaras"></a>

    <!-- 6 - casa 2 -->
    <a class="hitbox" data-dest="casa2.html"
       style="left:62.92%; top:17.04%; width:5.60%; height:11.99%;"
       aria-label="casa 2"></a>

    <!-- 7 - minha casa -->
    <a class="hitbox" data-dest="minha-casa.html"
       style="left:8.44%; top:0.00%; width:14.35%; height:16.62%;"
       aria-label="minha casa"></a>

    <!-- 8 - placeholder -->
    <a class="hitbox" data-dest="placeholder8.html"
       style="left:81.15%; top:30.74%; width:8.10%; height:16.25%;"
       aria-label="placeholder 8"></a>

    <!-- 9 - placeholder -->
    <a class="hitbox" data-dest="placeholder9.html"
       style="left:94.48%; top:2.59%; width:3.52%; height:6.62%;"
       aria-label="placeholder 9"></a>
  </div>
</div>

<div id="blackout"></div>

<script>
  const blackout = document.getElementById('blackout');

  document.querySelectorAll('.hitbox').forEach(hb => {
    hb.addEventListener('click', (e) => {
      e.preventDefault();
      const dest = hb.dataset.dest;
      blackout.classList.add('on');
      setTimeout(() => {
        window.location.href = dest;
      }, 550);
    });
  });
</script>

</body>
</html>
