<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa da vila</title>
<link rel="stylesheet" href="assets/css/cursor.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'ComicFallback', cursive, sans-serif;
  }

  #mapWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  /* mapInner sempre cobre a tela inteira mantendo a proporcao 16:9
     da arte (igual "background-size: cover"), sem tarja preta */
  #mapInner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: max(100vw, 177.78vh);  /* 16/9 */
    height: max(100vh, 56.25vw);  /* 9/16 */
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    will-change: transform;
  }

  #mapInner img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* area clicavel: invisivel, so aparece um contorno leve no hover
     pra facilitar debug. Pode remover o outline do hover depois. */
  .hitbox {
    position: absolute;
    outline: 1px dashed transparent;
    transition: outline-color 0.15s ease, background 0.15s ease;
  }

  .hitbox:hover {
    outline-color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
  }

  /* cadeia de brilhinhos que roda pela borda da hitbox no hover */
  .glint {
    position: absolute;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,236,170,0.55) 45%, transparent 75%);
    box-shadow: 0 0 7px 2px rgba(255,244,200,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    animation: glintTravel 3.4s linear infinite;
  }

  .hitbox:hover .glint {
    opacity: var(--glint-opacity, 1);
  }

  @keyframes glintTravel {
    0%   { left: 0%;   top: 0%; }
    25%  { left: 100%; top: 0%; }
    50%  { left: 100%; top: 100%; }
    75%  { left: 0%;   top: 100%; }
    100% { left: 0%;   top: 0%; }
  }

  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in;
    z-index: 50;
  }

  #blackout.on {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="mapWrap">
  <div id="mapInner">
    <!-- troque o src pelo caminho real da imagem quando subir pro GitHub -->
    <img src="assets/images/mapa-beta-1.jpg" alt="mapa da vila" draggable="false">

    <!-- 1 - fonte -->
    <a class="hitbox" data-dest="fonte.html"
       style="left:39.79%; top:34.26%; width:7.68%; height:14.95%;"
       aria-label="fonte"></a>

    <!-- 2 - casa 1 -->
    <a class="hitbox" data-dest="casa1.html"
       style="left:25.73%; top:29.81%; width:7.27%; height:15.88%;"
       aria-label="casa 1"></a>

    <!-- 3 - prefeitura -->
    <a class="hitbox" data-dest="prefeitura.html"
       style="left:20.73%; top:56.30%; width:10.29%; height:23.10%;"
       aria-label="prefeitura"></a>

    <!-- 4 - lago de almas -->
    <a class="hitbox" data-dest="lago-de-almas.html"
       style="left:40.52%; top:68.52%; width:7.79%; height:14.77%;"
       aria-label="lago de almas"></a>

    <!-- 5 - castelo das mascaras -->
    <a class="hitbox" data-dest="castelo-das-mascaras.html"
       style="left:63.33%; top:62.96%; width:7.89%; height:16.81%;"
       aria-label="castelo das mascaras"></a>

    <!-- 6 - casa 2 -->
    <a class="hitbox" data-dest="casa2.html"
       style="left:62.92%; top:17.04%; width:5.60%; height:11.99%;"
       aria-label="casa 2"></a>

    <!-- 7 - minha casa -->
    <a class="hitbox" data-dest="minha-casa.html"
       style="left:8.44%; top:0.00%; width:14.35%; height:16.62%;"
       aria-label="minha casa"></a>

    <!-- 8 - placeholder -->
    <a class="hitbox" data-dest="placeholder8.html"
       style="left:81.15%; top:30.74%; width:8.10%; height:16.25%;"
       aria-label="placeholder 8"></a>

    <!-- 9 - placeholder -->
    <a class="hitbox" data-dest="placeholder9.html"
       style="left:94.48%; top:2.59%; width:3.52%; height:6.62%;"
       aria-label="placeholder 9"></a>
  </div>
</div>

<div id="blackout"></div>

<script>
  const blackout = document.getElementById('blackout');
  const mapInner = document.getElementById('mapInner');
  const mapWrap = document.getElementById('mapWrap');

  // ---------- zoom com o scroll (100% a 250%) ----------
  const MIN_ZOOM = 1;
  const MAX_ZOOM = 2.5;
  const ZOOM_STEP = 0.1;
  let zoom = 1;

  // ---------- pan da camera (estilo League of Legends) ----------
  const EDGE_ZONE = 90;        // px da borda da tela que ativa o pan
  const MAX_PAN_SPEED = 700;   // px por segundo, no maximo (cursor colado na borda)

  let panX = 0;
  let panY = 0;
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function clampPan() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const baseW = mapInner.offsetWidth;
    const baseH = mapInner.offsetHeight;

    const overflowX = Math.max(0, (baseW * zoom - vw) / 2);
    const overflowY = Math.max(0, (baseH * zoom - vh) / 2);

    panX = Math.min(overflowX, Math.max(-overflowX, panX));
    panY = Math.min(overflowY, Math.max(-overflowY, panY));
  }

  function applyTransform() {
    mapInner.style.transform =
      `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom})`;
  }

  mapWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dir = e.deltaY > 0 ? -1 : 1;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom + dir * ZOOM_STEP));
    clampPan();
    applyTransform();
  }, { passive: false });

  let lastFrameTime = performance.now();

  function panLoop(now) {
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000); // trava dt pra evitar saltos
    lastFrameTime = now;

    if (zoom > 1.001) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let vx = 0;
      let vy = 0;

      if (mouseX < EDGE_ZONE) {
        vx = MAX_PAN_SPEED * (1 - mouseX / EDGE_ZONE);
      } else if (mouseX > vw - EDGE_ZONE) {
        vx = -MAX_PAN_SPEED * (1 - (vw - mouseX) / EDGE_ZONE);
      }

      if (mouseY < EDGE_ZONE) {
        vy = MAX_PAN_SPEED * (1 - mouseY / EDGE_ZONE);
      } else if (mouseY > vh - EDGE_ZONE) {
        vy = -MAX_PAN_SPEED * (1 - (vh - mouseY) / EDGE_ZONE);
      }

      if (vx !== 0 || vy !== 0) {
        panX += vx * dt;
        panY += vy * dt;
        clampPan();
        applyTransform();
      }
    }

    requestAnimationFrame(panLoop);
  }
  requestAnimationFrame(panLoop);

  // ---------- cadeia de brilhinhos no hover das hitboxes ----------
  const GLINT_COUNT = 6;
  const GLINT_DURATION = 3.4; // precisa bater com o "animation" no CSS (glintTravel)

  document.querySelectorAll('.hitbox').forEach(hb => {
    for (let i = 0; i < GLINT_COUNT; i++) {
      const dot = document.createElement('span');
      dot.className = 'glint';
      const delay = -(i * (GLINT_DURATION / GLINT_COUNT));
      dot.style.animationDelay = delay + 's';
      dot.style.setProperty('--glint-opacity', (1 - i * 0.15).toFixed(2));
      hb.appendChild(dot);
    }
  });

  // ---------- clique nas hitboxes ----------
  document.querySelectorAll('.hitbox').forEach(hb => {
    hb.addEventListener('click', (e) => {
      e.preventDefault();
      const dest = hb.dataset.dest;
      blackout.classList.add('on');
      setTimeout(() => {
        window.location.href = dest;
      }, 550);
    });
  });
</script>

</body>
</html>
